# Publications list — single source of truth for both the homepage
# "Recent Papers" section (_pages/home.html) and the full list
# (_pages/publications-full.html). Numbering is derived automatically
# from this file, so to add a paper just prepend a new entry at the top
# (newest first). Fields:
#   authors  – full author string, exactly as it should display
#   year     – publication year
#   title    – article title (no trailing period; the template adds it)
#   journal  – abbreviated journal name (rendered in italics)
#   volume   – (optional) volume number
#   pages    – (optional) page range, e.g. "72-83"
#   doi      – DOI without the "doi:" prefix
#   pdf      – (optional) filename in /documents/papers/
#   status   – (optional) e.g. "In press at"; used for accepted-but-not-
#              yet-published papers. Omit `year`, `volume`, `pages`, and
#              `doi` for these; they render as "Title. In press at Journal."
#   short    – (optional) shorter title used only on the homepage;
#              falls back to `title` when omitted

